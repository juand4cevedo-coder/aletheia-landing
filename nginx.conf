server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para acelerar la carga
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Caché larga para los assets con hash en el nombre (Vite los versiona)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad básicas (tríada CIA: integridad y confidencialidad)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}