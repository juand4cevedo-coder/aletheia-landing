# ---------------------------------------------------------------------------
# Despliegue automático de ALETHEIA Landing a GitHub Pages.
# Cada vez que se hace push a la rama main, GitHub:
#   1) instala dependencias con pnpm,
#   2) compila el proyecto (pnpm build -> carpeta dist/),
#   3) publica dist/ en GitHub Pages.
# No requiere ninguna configuración manual adicional salvo activar Pages
# en Settings -> Pages -> Source: GitHub Actions (ver la guía DEPLOY-Y-GITFLOW.md).
# ---------------------------------------------------------------------------
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

# Permisos que necesita el job de despliegue
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos pisándose entre sí
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar el sitio
        run: pnpm build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
